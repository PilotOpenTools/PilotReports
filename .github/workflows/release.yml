name: Release

# Тег vX.Y.Z: проверка версии, сборка, тесты и GitHub Release с zip модуля и контрольными суммами.
# Описание релиза - раздел версии из CHANGELOG.md; без него workflow падает.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PILOT_CLIENT_VERSION: 26.13.0.62219

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      # Тег должен совпадать с <Version> в Reports.csproj, иначе в релиз уйдут файлы другой версии
      - name: Check version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath Reports.csproj -Raw)
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Неверная версия в Reports.csproj: $version" }
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Тег $env:GITHUB_REF_NAME не совпадает с Version $version в Reports.csproj" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: lib/pilot
          key: pilot-client-${{ env.PILOT_CLIENT_VERSION }}

      - name: Pilot client assemblies
        shell: pwsh
        run: ./tools/get-pilot-client.ps1 -Version $env:PILOT_CLIENT_VERSION

      - name: Pilot.ClientSdk package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/get-clientsdk.ps1

      - name: Build
        run: dotnet build Reports.sln -c Release -p:RestoreConfigFile=nuget.local.config -p:CopyToPilot=false --nologo

      - name: Test
        run: dotnet test Reports.sln -c Release --no-build --nologo

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "bin/112Reports.ext2-$env:VERSION.zip" artifacts/
          Push-Location artifacts
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8
          $start = [array]::FindIndex($changelog, [Predicate[string]] { param($l) $l.StartsWith("## [$env:VERSION]") })
          if ($start -lt 0) { throw "В CHANGELOG.md нет раздела [$env:VERSION]" }
          $notes = @()
          for ($i = $start + 1; $i -lt $changelog.Count -and -not $changelog[$i].StartsWith('## ['); $i++) { $notes += $changelog[$i] }
          $notes += ''
          $notes += '### Установка'
          $notes += ''
          $notes += "Загрузите ``112Reports.ext2-$env:VERSION.zip`` на сервер Pilot и назначьте пользователям вместе с ``113Pilot.ClientSdk.ext2`` ([PilotClientSdk](https://github.com/PilotOpenTools/PilotClientSdk/releases/latest)). Адреса статистики и GitLab задаются в общих настройках Pilot (разделы «PilotOpenTools отправка статистики» и «PilotOpenTools отчёты (GitLab)») или в ``Reports.config.json`` рядом с dll, подробнее: [руководство](https://github.com/PilotOpenTools/PilotReports/blob/main/docs/guide.md)."
          $notes | Set-Content -LiteralPath release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --clobber @files
          } else {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "PilotReports $env:GITHUB_REF_NAME" --notes-file release-notes.md @files
          }
          if ($LASTEXITCODE) { throw "gh release завершился с кодом $LASTEXITCODE" }
