# CI/CD клиентского модуля Pilot (схема веток Pilot-BIM).
#   feature/KTN-… , bugfix/KTN-…  / MR (squash) / dev           / сервер ТЕСТ
#   dev | release-prep/X.Y.Z      / MR          / release/X.Y.Z / сервер СТЕЙДЖ
#   release/X.Y.Z | hotfix/KTN-…  / MR          / main          / сервер ПРОД + GitLab Release vX.Y.Z
#
# check_version - версия X.Y.Z (три числа). Версию выставляет веб-админка при релизе/hotfix, поэтому:
#                 MR задачи (в dev, release/*) - предупреждение, если версию поменяли вручную;
#                 main - версия выросла и в CHANGELOG.md есть раздел [X.Y.Z], иначе ошибка (прод и Releases).
# build_module  - zip модуля (bin/*.zip); перед сборкой скачивает сборки клиента Pilot из реестра пакетов (PILOT_CLIENT_VERSION).
# check_libraries - библиотеки модуля по режиму веб-админки (Настройки / «Библиотеки модулей»): лишние dll в zip и
#                 ссылки на неразрешённые библиотеки. Режимы «запретить» и «только из списка» - ошибка, «предупреждать» - предупреждение.
# test_module   - тесты xUnit (net48, WPF и DPAPI) на Windows-раннере с тегом windows; включается переменной WINDOWS_RUNNER=true.
# deploy_*      - zip уходит в веб-админку (POST /api/ci/modules/deploy), она пишет его на сервер Pilot контура.
#                 Админка принимает выкладку только с двумя доказательствами: ключом контура (X-Deploy-Key) и токеном
#                 задания (X-Job-Token = CI_JOB_TOKEN). Ветку, коммит, проект и pipeline она берёт из GitLab по токену задания;
#                 поля формы ref/sha/project/user/pipeline_url - только для диагностики и обязаны совпасть с проверенными.
# Тег vX.Y.Z и GitLab Release (раздел CHANGELOG.md) ставит веб-админка при выпуске в прод - в CI их нет.
#
# Переменные CI/CD (группа модулей в GitLab / Settings / CI/CD / Variables):
#   DEPLOY_KEY_TEST  - ключ контура тест  (= MODULES_DEPLOY_KEY_TEST админки), Masked;
#   DEPLOY_KEY_STAGE - ключ контура стейдж (= MODULES_DEPLOY_KEY_STAGE), Masked и Protected;
#   DEPLOY_KEY_PROD  - ключ контура прод (= MODULES_DEPLOY_KEY_PROD), Masked и Protected;
#   ADMIN_URL        - адрес админки, по умолчанию http://host.docker.internal:5300 (HTTP - только внутри Docker-хоста;
#                            для админки на другой машине задайте https://…, иначе ключи и zip идут открытым текстом).
#   WINDOWS_RUNNER   - true, если есть Windows-раннер с тегом windows (задание test_module).
#   PILOT_CLIENT_VERSION   - версия пакета pilot-client (сборки клиента Pilot для компиляции) в реестре пакетов этого проекта, по умолчанию 26.13.0.
#                            Пакет грузит администратор: tools/publish-pilot-client.ps1 (см. lib/README.md). build_module и test_module берут его
#                            по ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pilot-client/<версия>/pilot-client.zip токеном задания.
# Ветки main и release/* защищены в GitLab (merge: Maintainers; push: main - No one, release/* - Maintainers, потому что админка
# создаёт release/X.Y.Z и коммитит в неё версию и CHANGELOG.md), поэтому Protected-ключи stage и prod недоступны заданиям
# из чужих веток. check_libraries ключей не использует - ему хватает токена задания.
# test_module идёт на Windows-раннере: shell раннера с тегом windows должен быть powershell (в cmd блок foreach не сработает).

stages:
  - check
  - build
  - deploy

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_CLI_TELEMETRY_OPTOUT: "1"
  ADMIN_URL: "http://host.docker.internal:5300"
  PILOT_CLIENT_VERSION: "26.13.0"
  SDK_IMAGE: "mcr.microsoft.com/dotnet/sdk:10.0.404@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never                       # тег vX.Y.Z ставит веб-админка - pipeline на тег не нужен
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

# Схема веток: что куда можно вливать и имена веток задач (номер задачи Kaiten).
branch_rules:
  stage: check
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      SRC="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      DST="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      echo "Merge Request: $SRC -> $DST"
      ok() { echo "$SRC" | grep -Eq "$1"; }
      case "$DST" in
        dev)
          ok '^(feature|bugfix)/.' || ok '^(release|hotfix)/' || ok '^ci/' ||
            { echo "В dev вливаются только feature/* и bugfix/* - ветки задач (и обратное слияние release/*, hotfix/*; ci/* - обновление шаблона CI из веб-админки)."; exit 1; } ;;
        release/*)
          ok '^dev$' || ok '^release-prep/' || ok '^bugfix/.' || ok '^hotfix/' ||
            { echo "В release/X.Y.Z вливаются только dev, release-prep/X.Y.Z, bugfix/* и hotfix/*."; exit 1; } ;;
        main|master)
          ok '^release/[0-9]+\.[0-9]+\.[0-9]+$' || ok '^hotfix/.' ||
            { echo "В main вливаются только release/X.Y.Z и hotfix/*."; exit 1; } ;;
      esac
      echo "Схема веток соблюдена."

# Версия модуля и CHANGELOG.md. Код выхода 3 - предупреждение (job жёлтый, pipeline идёт дальше).
.check_version:
  stage: check
  image: $SDK_IMAGE
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      # Runner запускает скрипт с set -eo pipefail: grep без совпадений оборвал бы его. Ошибки обрабатываем сами.
      set +e +o pipefail
      WARN=0
      warn() { echo -e "\e[33mВНИМАНИЕ: $*\e[0m"; WARN=1; }

      # Версия X.Y.Z: <Version> в .csproj, иначе AssemblyVersion в AssemblyInfo.cs.
      version_of() {   # $1 - коммит/ветка (пусто - рабочая копия)
        local proj info v
        if [ -z "$1" ]; then
          proj=$(ls *.csproj 2>/dev/null | head -1); [ -n "$proj" ] && v=$(grep -oP '<Version>\K[0-9]+(\.[0-9]+){1,3}' "$proj" | head -1)
          [ -z "${v:-}" ] && info=$(find . -maxdepth 2 -name AssemblyInfo.cs | head -1) && [ -n "$info" ] && v=$(grep -oP 'AssemblyVersion\("\K[0-9]+(\.[0-9]+){1,3}' "$info" | head -1)
        else
          proj=$(git ls-tree --name-only "$1" | grep -E '\.csproj$' | head -1)
          [ -n "$proj" ] && v=$(git show "$1:$proj" 2>/dev/null | grep -oP '<Version>\K[0-9]+(\.[0-9]+){1,3}' | head -1)
          [ -z "${v:-}" ] && for f in AssemblyInfo.cs Properties/AssemblyInfo.cs; do
            v=$(git show "$1:$f" 2>/dev/null | grep -oP 'AssemblyVersion\("\K[0-9]+(\.[0-9]+){1,3}' | head -1); [ -n "$v" ] && break; done
        fi
        echo "${v:-}" | cut -d. -f1-3
      }
      newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }

      VERSION=$(version_of "")
      [ -n "$VERSION" ] || { echo "Не найдена версия модуля (<Version> в .csproj или AssemblyVersion)."; exit 1; }
      echo "Версия модуля: $VERSION"

      # Версия модуля - в одном месте: <Version>X.Y.Z</Version> в .csproj (AssemblyVersion/FileVersion генерирует SDK).
      PROJ=$(ls *.csproj 2>/dev/null | head -1)
      RAW=$( [ -n "$PROJ" ] && grep -ohP '<Version>\K[^<]+' "$PROJ" | head -1)
      [ -z "$RAW" ] || echo "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || warn "<Version>$RAW</Version> - не X.Y.Z. Версия модуля - три числа: $(echo "$RAW" | cut -d. -f1-3)."
      EXTRA=$( { [ -n "$PROJ" ] && grep -oE '<(FileVersion|AssemblyVersion)>[^<]*</' "$PROJ" | sed 's#</$##';
                 find . -maxdepth 2 -name AssemblyInfo.cs -exec grep -oE 'Assembly(File|Informational)?Version\("[^"]*"' {} \; ; } 2>/dev/null | tr '\n' ' ')
      [ -z "$EXTRA" ] || warn "версия записана не только в <Version> csproj: $EXTRA- уберите (кнопка «Обновить CI и версию» на странице модуля в веб-админке)."

      DST="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"; SRC="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}"
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ] || [ "${CI_COMMIT_BRANCH:-}" = "master" ] || [ "$DST" = "main" ] || [ "$DST" = "master" ]; then
        # main: версия выросла, тега vX.Y.Z ещё нет, в CHANGELOG.md есть раздел - их ставит веб-админка при релизе/hotfix.
        if [ -n "$DST" ]; then
          git fetch -q origin "$DST"; BASE_REF="origin/$DST"; BASE_TEXT="ветка $DST"
        elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$CI_COMMIT_BEFORE_SHA" 2>/dev/null; then
          BASE_REF="$CI_COMMIT_BEFORE_SHA"; BASE_TEXT="$CI_COMMIT_BRANCH до слияния (${CI_COMMIT_BEFORE_SHA:0:8})"
        else
          BASE_REF=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- '-rc' | head -1); BASE_TEXT="тег $BASE_REF"
        fi
        BASE=""; [ -n "$BASE_REF" ] && BASE=$(version_of "$BASE_REF")
        if [ -z "$BASE" ]; then
          echo "Предыдущей версии нет - первая версия модуля."
        elif newer "$VERSION" "$BASE"; then
          echo "Версия выросла: $BASE / $VERSION ($BASE_TEXT)."
        else
          warn "версия модуля не выросла: $VERSION, а в $BASE_TEXT - $BASE. Релиз и hotfix выпускаются из веб-админки - она сама поднимает версию."
        fi
        TAG_SHA=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" 2>/dev/null)
        if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$CI_COMMIT_SHA" ]; then
          warn "тег v$VERSION уже стоит на другом коммите (${TAG_SHA:0:8}): версия $VERSION уже выпускалась в прод."
        elif [ -n "$TAG_SHA" ]; then
          echo "Тег v$VERSION уже на этом коммите (его поставила веб-админка при выпуске)."
        fi
        if [ ! -f CHANGELOG.md ]; then
          warn "нет файла CHANGELOG.md (его пишет веб-админка при релизе)."
        elif ! grep -Eq "^##[[:space:]]*\[?$VERSION\]?" CHANGELOG.md; then
          warn "в CHANGELOG.md нет раздела '## [$VERSION]' (его пишет веб-админка при релизе)."
        else
          awk -v v="$VERSION" 'BEGIN{p=0} /^##[[:space:]]/{ if (p) exit; if (index($0, "[" v "]") || $2 == v) {p=1; next} } p' CHANGELOG.md > release_notes.md
          echo "Раздел CHANGELOG.md для $VERSION:"; cat release_notes.md
        fi
      elif [ -n "$DST" ] && ! echo "$SRC" | grep -Eq '^(release|release-prep|hotfix)/'; then
        # MR задачи (в dev или в release/X.Y.Z): версию руками не меняем - её выставляет «Релиз / стейдж» или «Hotfix».
        git fetch -q origin "$DST"; BASE=$(version_of "origin/$DST")
        if [ -n "$BASE" ] && [ "$VERSION" != "$BASE" ]; then
          warn "версия изменена вручную: $BASE / $VERSION. Версию выставляет веб-админка при релизе («Релиз / стейдж» - minor, «Hotfix» - patch). Верните $BASE в .csproj/AssemblyInfo."
        else
          echo "Версия не менялась ($VERSION) - её выставит релиз."
        fi
      else
        echo "Рост версии здесь не проверяется: версию выставляет веб-админка при релизе."
      fi
      [ -s release_notes.md ] || echo "Версия $VERSION (описание изменений не найдено в CHANGELOG.md)." > release_notes.md

      echo "VERSION=$VERSION" > version.env
      if [ "$WARN" = 1 ]; then echo "Проверка версии: есть предупреждения."; exit 3; fi
      echo "Проверка версии пройдена."
  artifacts:
    when: always
    paths: [release_notes.md]
    reports:
      dotenv: version.env
    expire_in: 180 days

check_version:
  extends: .check_version
  allow_failure:
    exit_codes: [3]                     # предупреждение - job жёлтый, pipeline идёт дальше
  rules:
    # На main/master повторная или неописанная версия - ошибка: прод и Releases не должны получить её ещё раз.
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH

# Сборка модуля. Артефакт - zip для загрузки в Pilot (его выкладывают job deploy_*).
# Проект должен собирать bin/*.zip в Release (target CreateReleaseZip); если zip нет - он собирается из сборок папки Release.
build_module:
  stage: build
  image: $SDK_IMAGE
  needs: []
  variables:
    GIT_DEPTH: "0"                      # номер сборки dev считается по истории до тега релиза
  script:
    - PROJ=$(ls *.csproj | head -1)
    - echo "Проект $PROJ"
    - |
      # Сборки клиента Pilot (проприетарные, в репозитории их нет) - из реестра пакетов проекта в lib/pilot.
      URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pilot-client/$PILOT_CLIENT_VERSION/pilot-client.zip"
      # Без -L: при редиректе (например, на хранилище объектов) токен задания не должен уйти на другой хост - переход делаем сами, без заголовка.
      OUT=$(curl -sS -o pilot-client.zip -w '%{http_code} %{redirect_url}' -H "JOB-TOKEN: $CI_JOB_TOKEN" "$URL") || OUT="000 "
      CODE=${OUT%% *}
      case "$CODE" in 301|302|303|307|308) CODE=$(curl -sS -L -o pilot-client.zip -w '%{http_code}' "${OUT#* }") || CODE=000 ;; esac
      if [ "$CODE" != "200" ]; then
        echo -e "\e[31mНет пакета pilot-client $PILOT_CLIENT_VERSION в реестре пакетов проекта (HTTP $CODE): $URL\e[0m"
        echo "Загрузите его с машины, где установлен клиент Pilot:"
        echo "  pwsh tools/publish-pilot-client.ps1 -GitLabUrl $CI_SERVER_URL -ProjectId $CI_PROJECT_ID -Version $PILOT_CLIENT_VERSION   (токен - в GITLAB_TOKEN)"
        echo "или задайте в переменных CI/CD PILOT_CLIENT_VERSION существующей версии."
        exit 1
      fi
      mkdir -p lib/pilot
      unzip -qo pilot-client.zip -d lib/pilot || bsdtar -xf pilot-client.zip -C lib/pilot || pwsh -NoProfile -Command "Expand-Archive -Path pilot-client.zip -DestinationPath lib/pilot -Force"
      [ -f lib/pilot/Ascon.Pilot.Pilot.dll ] || { echo "В пакете pilot-client нет Ascon.Pilot.Pilot.dll: zip должен содержать шесть dll в корне (tools/publish-pilot-client.ps1)."; exit 1; }
      rm -f pilot-client.zip
    - |
      # Пакеты из реестра GitLab (Pilot.ClientSdk и др.): источники с /api/v4/ на хосте $CI_SERVER_HOST из nuget.config - вход токеном этого job;
      # источникам на других хостах токен не отдаётся.
      HOST_RE=$(printf '%s' "$CI_SERVER_HOST" | sed 's/\./\\./g')
      for CFG in nuget.config NuGet.config NuGet.Config; do
        [ -f "$CFG" ] || continue
        for SRC in $(grep -oP '<add\s+key="\K[^"]+(?="\s+value="https?://'"$HOST_RE"'(:[0-9]+)?(/[^"]*)?/api/v4/)' "$CFG"); do
          # SDK 10 (NuGet 7) не пускает в источник по http и снимает allowInsecureConnections при update: разрешаем http только своему GitLab.
          case "$(grep -oP '<add\s+key="\Q'"$SRC"'\E"\s+value="\K[^"]+' "$CFG")" in http://*) INSECURE=--allow-insecure-connections ;; *) INSECURE= ;; esac
          dotnet nuget update source "$SRC" --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text $INSECURE --configfile "$CFG"
        done
      done
    - |
      # Сборка dev (тест): к версии из csproj дописывается номер сборки - сколько задач в dev сверх тега релиза:
      # 1.3.0 / 1.3.0.4. По версии на тесте видно, обновился ли модуль; csproj не меняется, релиз выставит X.Y.Z.
      BUILD_VERSION=""
      if [ "${CI_COMMIT_BRANCH:-}" = "dev" ]; then
        BASE=$(grep -oP '<Version>\K[0-9]+\.[0-9]+\.[0-9]+' "$PROJ" | head -1 || true)
        if [ -n "$BASE" ]; then
          TAG=$(git tag -l "v$BASE"); [ -n "$TAG" ] || TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- '-rc' | head -1)
          # Задачи - коммиты без слияний, кроме служебных (шаблон CI, версия и CHANGELOG.md релиза), как «задачи сверх релиза» в админке.
          N=$(git log --no-merges --format=%s ${TAG:+"$TAG..HEAD"} | grep -Evc '^(CI/CD модуля:|Merge branch|Релиз .*[Вв]ерси)|CHANGELOG\.md' || true)
          BUILD_VERSION="$BASE.$N"
          echo "Версия сборки для теста: $BUILD_VERSION (задач в dev сверх ${TAG:-начала истории}: $N)"
        else
          echo "В .csproj нет <Version>X.Y.Z</Version> - номер сборки не дописываю."
        fi
      fi
      dotnet build "$PROJ" -c Release -p:CopyToPilot=false -p:EnableWindowsTargeting=true ${BUILD_VERSION:+-p:Version=$BUILD_VERSION -p:SourceRevisionId=$CI_COMMIT_SHORT_SHA}
    - |
      if [ -z "$(find bin -name '*.zip' | head -1)" ]; then
        DLL=$(find bin -path '*Release*' -name '*.ext2.dll' | head -1)
        [ -n "$DLL" ] || { echo "Не найдена сборка *.ext2.dll"; exit 1; }
        OUT=$(dirname "$DLL")
        NAME=$(basename "$DLL" .dll)
        (cd "$OUT" && zip -qr "$CI_PROJECT_DIR/bin/$NAME.zip" .) 2>/dev/null || pwsh -NoProfile -Command "Compress-Archive -Path '$OUT/*' -DestinationPath 'bin/$NAME.zip' -Force"
      fi
    - find bin -name '*.zip' -exec ls -la {} \;
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > build.env
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - bin/**/*.zip
    reports:
      dotenv: build.env
    expire_in: 180 days

# Тесты модуля: net48 с WPF и DPAPI, на Linux-раннере не запускаются. Задание идёт на Windows-раннере с тегом windows
# и только если в группе задано WINDOWS_RUNNER=true; тогда deploy_* ждёт его успешного завершения.
test_module:
  stage: build
  needs: []
  tags: [windows]
  rules:
    - if: $WINDOWS_RUNNER == "true"
  script:
    - |
      # Сборки клиента Pilot (проприетарные, в репозитории их нет) - из реестра пакетов проекта в lib/pilot.
      $url = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/pilot-client/$env:PILOT_CLIENT_VERSION/pilot-client.zip"
      try {
        # Без автоматических редиректов: токен задания не должен уйти на другой хост - переход делаем сами, без заголовка.
        $req = [Net.HttpWebRequest]::Create($url)
        $req.AllowAutoRedirect = $false
        $req.Headers.Add('JOB-TOKEN', $env:CI_JOB_TOKEN)
        $resp = $req.GetResponse()
        try {
          if ([int]$resp.StatusCode -ge 300 -and [int]$resp.StatusCode -lt 400) {
            Invoke-WebRequest -Uri ([Uri]::new([Uri]$url, [string]$resp.Headers['Location'])) -OutFile pilot-client.zip -UseBasicParsing
          } else {
            $file = [IO.File]::Create((Join-Path (Get-Location).Path 'pilot-client.zip'))
            try { $resp.GetResponseStream().CopyTo($file) } finally { $file.Dispose() }
          }
        } finally { $resp.Dispose() }
      } catch {
        Write-Host "Нет пакета pilot-client $env:PILOT_CLIENT_VERSION в реестре пакетов проекта: $url ($($_.Exception.Message))"
        Write-Host "Загрузите его с машины, где установлен клиент Pilot:"
        Write-Host "  pwsh tools/publish-pilot-client.ps1 -GitLabUrl $env:CI_SERVER_URL -ProjectId $env:CI_PROJECT_ID -Version $env:PILOT_CLIENT_VERSION   (токен - в GITLAB_TOKEN)"
        Write-Host "или задайте в переменных CI/CD PILOT_CLIENT_VERSION существующей версии."
        exit 1
      }
      Expand-Archive -Path pilot-client.zip -DestinationPath lib/pilot -Force
      if (-not (Test-Path lib/pilot/Ascon.Pilot.Pilot.dll)) { Write-Host "В пакете pilot-client нет Ascon.Pilot.Pilot.dll: zip должен содержать шесть dll в корне (tools/publish-pilot-client.ps1)."; exit 1 }
      Remove-Item pilot-client.zip
    - |
      $hostRe = [regex]::Escape($env:CI_SERVER_HOST)
      # SDK 10 (NuGet 7) не пускает в источник по http и снимает allowInsecureConnections при update; SDK 8 этого флага не знает и ему он не нужен.
      $flagKnown = [bool](dotnet nuget update source --help | Select-String -SimpleMatch 'allow-insecure-connections')
      foreach ($m in Select-String -Path nuget.config -Pattern ('<add\s+key="([^"]+)"\s+value="(https?)://' + $hostRe + '(:[0-9]+)?(/[^"]*)?/api/v4/') | ForEach-Object { $_.Matches[0] }) {
        $src = $m.Groups[1].Value
        $insecure = if ($flagKnown -and $m.Groups[2].Value -eq 'http') { '--allow-insecure-connections' } else { $null }
        dotnet nuget update source $src --username gitlab-ci-token --password $env:CI_JOB_TOKEN --store-password-in-clear-text $insecure --configfile nuget.config
      }
    - dotnet test tests/Reports.Tests -c Release --logger "trx;LogFileName=tests.trx"
  artifacts:
    when: always
    paths:
      - tests/Reports.Tests/TestResults/*.trx
    expire_in: 30 days

# Библиотеки модуля - проверяет веб-админка (POST /api/ci/modules/check-libraries), без выкладки.
# Код выхода 3 - предупреждение (job жёлтый): режим «Предупреждать о библиотеках» или админка не проверила.
check_libraries:
  stage: build
  image: $SDK_IMAGE
  needs:
    - job: build_module
  allow_failure:
    exit_codes: [3]
  script:
    - |
      ZIP=$(find bin -name '*.zip' | head -1)
      [ -n "$ZIP" ] || { echo "Нет zip модуля из build_module."; exit 1; }
      CODE=$(curl -sS -o libraries.log -w '%{http_code}' --max-time 300 \
        -H "X-Job-Token: $CI_JOB_TOKEN" \
        -F "file=@$ZIP" --form-string "project=$CI_PROJECT_PATH" --form-string "ref=$CI_COMMIT_REF_NAME" \
        --form-string "target=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" \
        "$ADMIN_URL/api/ci/modules/check-libraries") || CODE=000
      cat libraries.log 2>/dev/null || true
      if [ "$CODE" != "200" ]; then
        echo -e "\e[33mВНИМАНИЕ: админка не проверила библиотеки (HTTP $CODE) - их проверит админка при выкладке.\e[0m"; exit 3
      fi
      RESULT=$(grep -o 'RESULT: [a-z]*' libraries.log | tail -1 || true)
      case "$RESULT" in
        "RESULT: ok") echo "Библиотеки по правилам." ;;
        "RESULT: warn") echo -e "\e[33mБиблиотеки: есть предупреждения.\e[0m"; exit 3 ;;
        *) echo -e "\e[31mБиблиотеки не по правилам - выкладка запрещена.\e[0m"; exit 1 ;;
      esac

# Выкладка: zip из build_module / админка / сервер Pilot контура. Журнал админки печатается в лог job.
.deploy:
  stage: deploy
  image: $SDK_IMAGE
  needs:
    - job: check_version
    - job: build_module
    - job: check_libraries
    - job: test_module
      optional: true                      # есть, только если включён Windows-раннер (WINDOWS_RUNNER)
  script:
    - |
      # Ключ контура: тест - DEPLOY_KEY_TEST, стейдж - ..._STAGE, прод - ..._PROD (контур = environment задания).
      case "$CI_ENVIRONMENT_NAME" in
        test)  KEY_NAME=DEPLOY_KEY_TEST;  DEPLOY_KEY="${DEPLOY_KEY_TEST:-}" ;;
        stage) KEY_NAME=DEPLOY_KEY_STAGE; DEPLOY_KEY="${DEPLOY_KEY_STAGE:-}" ;;
        prod)  KEY_NAME=DEPLOY_KEY_PROD;  DEPLOY_KEY="${DEPLOY_KEY_PROD:-}" ;;
        *) echo "Неизвестный контур '$CI_ENVIRONMENT_NAME'."; exit 1 ;;
      esac
      [ -n "$DEPLOY_KEY" ] || { echo "Не задана переменная $KEY_NAME (Settings / CI/CD / Variables группы модулей; для stage и prod - Masked и Protected, ветки main и release/* защищены)."; exit 1; }
      case "$CI_COMMIT_REF_NAME" in release/*)
        if [ "${VERSION:-}" != "${CI_COMMIT_REF_NAME#release/}" ]; then
          echo "Сборка ${VERSION:-?} - ещё не версия релиза ${CI_COMMIT_REF_NAME#release/} (веб-админка поднимет её следующим коммитом). На стейдж не выкладываю."
          exit 0
        fi ;;
      esac
      ZIP=$(find bin -name '*.zip' | head -1)
      [ -n "$ZIP" ] || { echo "Нет zip модуля из build_module."; exit 1; }
      NOTES=$(git log -1 --pretty=%s "$CI_COMMIT_SHA")
      echo "Выкладка $ZIP ($CI_COMMIT_REF_NAME @ $CI_COMMIT_SHORT_SHA) / $CI_ENVIRONMENT_NAME через $ADMIN_URL"
      # --form-string: значение, начинающееся с < или @ (тема коммита «<KTN-1> …»), curl не принимает за путь к файлу.
      CODE=$(curl -sS -o deploy.log -w '%{http_code}' --max-time 600 \
        -H "X-Deploy-Key: $DEPLOY_KEY" -H "X-Job-Token: $CI_JOB_TOKEN" \
        -F "file=@$ZIP" --form-string "project=$CI_PROJECT_PATH" --form-string "project_url=$CI_PROJECT_URL" \
        --form-string "ref=$CI_COMMIT_REF_NAME" --form-string "sha=$CI_COMMIT_SHA" --form-string "pipeline_url=$CI_PIPELINE_URL" \
        --form-string "user=$GITLAB_USER_LOGIN" --form-string "notes=$NOTES" \
        "$ADMIN_URL/api/ci/modules/deploy") || CODE=000
      cat deploy.log 2>/dev/null || true
      [ "$CODE" = "200" ] || { echo "Выкладка не выполнена (HTTP $CODE)."; exit 1; }

deploy_test:
  extends: .deploy
  environment: { name: test }
  resource_group: deploy-test   # одна выкладка на контур одновременно
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_stage:
  extends: .deploy
  environment: { name: stage }
  resource_group: deploy-stage   # одна выкладка на контур одновременно
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\//

deploy_prod:
  extends: .deploy
  environment: { name: prod }
  resource_group: deploy-prod   # одна выкладка на контур одновременно
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"